name: Build

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default: read-only token for every job. The release
# job below re-declares the extra scopes it actually needs.
permissions:
  contents: read

jobs:
  # Supply-chain gate: fail fast if any vendored third-party bundle has been
  # altered (see scripts/verify-vendor.js + vendor/CHECKSUMS.txt). Every
  # other job depends on this, so nothing builds or ships from tampered deps.
  integrity:
    name: Verify vendored dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Verify vendored bundle checksums
        run: npm run verify:vendor

  test:
    name: Unit tests
    needs: integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # No install step: the extension and its unit tests have zero runtime
      # or test npm dependencies (node:test only). `pretest` re-verifies the
      # vendored checksums.
      - name: Run unit tests
        run: npm test

  e2e:
    name: End-to-end smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Playwright
        # --ignore-scripts blocks lifecycle scripts (a common supply-chain
        # vector); the browser is then fetched explicitly below. The version
        # comes from package.json's devDependencies (an exact pin, so the
        # toolchain is reproducible and Dependabot has one place to bump).
        run: |
          version="$(node -p "require('./package.json').devDependencies.playwright")"
          echo "Installing playwright@$version (pinned in package.json)"
          npm install --no-save --ignore-scripts --no-audit --no-fund "playwright@$version"
          npx playwright install --with-deps chromium
      - name: Run smoke test (offline, route-intercepted)
        run: npm run e2e
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: test/e2e/artifacts
          if-no-files-found: ignore

  package:
    name: Package extension
    needs: [integrity, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify manifest and version
        id: meta
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
          echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
      - name: Stage extension files
        run: |
          mkdir -p dist/graph-explorer-json-query
          cp -r manifest.json icons popup src vendor LICENSE dist/graph-explorer-json-query/
      # upload-artifact zips the staged folder itself, so the download is a
      # single zip: unzip it and "Load unpacked" the inner folder.
      - name: Upload extension artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graph-explorer-json-query-v${{ steps.meta.outputs.version }}
          path: dist/graph-explorer-json-query
          if-no-files-found: error

  # Every version bump that lands on main becomes a GitHub Release
  # (tag v<version>) with the ready-to-load zip attached. Re-runs on the
  # same version are no-ops, so pushes without a bump publish nothing.
  release:
    name: Publish release
    needs: [e2e, package]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets
      id-token: write # keyless signing for build provenance
      attestations: write # record the provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Re-verify vendored dependencies
        run: npm run verify:vendor
      - name: Read version
        id: meta
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"
      - name: Check whether this version is already released
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.meta.outputs.version }}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Package extension zip + checksum
        if: steps.released.outputs.exists == 'false'
        run: |
          mkdir -p dist/graph-explorer-json-query
          cp -r manifest.json icons popup src vendor LICENSE dist/graph-explorer-json-query/
          zip_name="graph-explorer-json-query-v${{ steps.meta.outputs.version }}.zip"
          (cd dist && zip -qr "$zip_name" graph-explorer-json-query)
          (cd dist && sha256sum "$zip_name" > "$zip_name.sha256")
      - name: Attest build provenance (SLSA)
        if: steps.released.outputs.exists == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/graph-explorer-json-query-v${{ steps.meta.outputs.version }}.zip
      - name: Create release
        if: steps.released.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.meta.outputs.version }}"
          gh release create "v$version" \
            "dist/graph-explorer-json-query-v$version.zip" \
            "dist/graph-explorer-json-query-v$version.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$version" \
            --generate-notes \
            --notes "Unzip the attached \`.zip\` and use **Load unpacked** on the inner folder — see the [README](https://github.com/$GITHUB_REPOSITORY#installation-load-unpacked).

          **Verify before installing:**
          - Checksum: \`sha256sum -c graph-explorer-json-query-v$version.zip.sha256\`
          - Build provenance: \`gh attestation verify graph-explorer-json-query-v$version.zip --repo $GITHUB_REPOSITORY\`
          - Vendored dependencies: after unzipping, \`npm run verify:vendor\` (or check \`vendor/CHECKSUMS.txt\`)."
